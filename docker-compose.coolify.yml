services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile.coolify
    restart: unless-stopped
    expose:
      - "80"
    mem_limit: 256m
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://tedsptech.com}
      ADMIN_EMAIL: thalysonemanuels.p@gmail.com
      ADMIN_SETUP_TOKEN: ${ADMIN_SETUP_TOKEN:-}
      DATA_DIR: /data
      PORT: "80"
    volumes:
      - portfolio-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      coolify-edge:
        aliases:
          - tedsp-portfolio

volumes:
  portfolio-data:

networks:
  coolify-edge:
    name: coolify-edge
    external: true
